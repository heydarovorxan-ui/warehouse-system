<!DOCTYPE html>
<html>

<head>
    <title>Categories</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>


<script>

let editCategoryId = null;
let editMode = false;

async function deleteCategory(id) {

    if (!confirm("Delete this category?")) {
        return;
    }

    const response = await fetch(`/categories/${id}`, {
        method: "DELETE"
    });

    if (response.ok) {

        loadCategories();

    } else {

        alert("Cannot delete category");

    }

}

function editCategory(id) {

    editMode = true;
    editCategoryId = id;
    

    const row = event.target.closest("tr");

    const categoryName = row.cells[1].innerText;

    document.getElementById("category-name").value = categoryName;
    document.getElementById("category-button").innerText = "Update Category";

}


async function loadCategories() {

    const response = await fetch("/categories");

    const categories = await response.json();

    const table = document.getElementById("categories-table");

    table.innerHTML = "";

    categories.forEach(category => {

        table.innerHTML += `
        <tr>
            <td>${category.id}</td>
            <td>${category.name}</td>
            <td>
                <button
                    class="btn btn-primary btn-sm me-2"
                    onclick="editCategory(${category.id})">
                    Edit
                </button>

                <button
                    class="btn btn-danger btn-sm"
                    onclick="deleteCategory(${category.id})">
                    Delete
                </button>
            </td>
        </tr>
        `;

    });

}

async function addCategory() {

    const category = {
        name: document.getElementById("category-name").value
    };

    let response;

    if (editMode) {

        response = await fetch(`/categories/${editCategoryId}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(category)
        });

    } else {

        response = await fetch("/categories", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(category)
        });

    }

    if (response.ok) {

        document.getElementById("category-name").value = "";

        editMode = false;
        editCategoryId = null;
        document.getElementById("category-button").innerText = "Add Category";

        loadCategories();

    } else {

        alert("Error creating category");

    }

}

loadCategories();

</script>

<body>

<div class="container mt-5">

    <h1>Categories</h1>

    <div class="card p-4 mb-4">

        <h4>Add Category</h4>

        <input
            id="category-name"
            class="form-control mb-3"
            placeholder="Category Name">

        <button
            id="category-button"
            class="btn btn-success"
            onclick="addCategory()">
            Add Category
        </button>

    </div>

    <table class="table table-bordered">

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="categories-table">

        </tbody>

    </table>

</div>

</body>

</html>
