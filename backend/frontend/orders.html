<!DOCTYPE html>
<html>

<head>

    <title>Orders</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<script>

let currentOrderId = null;

async function loadOrders() {

    const response = await fetch("/orders");

    const orders = await response.json();

    const table = document.getElementById("orders-table");

    table.innerHTML = "";

    orders.forEach(order => {

        table.innerHTML += `
            <tr>

                <td>${order.id}</td>

                <td>${order.customer_name}</td>

                <td>${order.customer_phone}</td>

                <td>${order.customer_address}</td>

                <td>${order.status}</td>

                <td>

                    <button 
                        class="btn btn-primary btn-sm"
                        onclick="showOrderDetails(${order.id})">
                        Details
                    </button>

                </td>

            </tr>
        `;

    });

    console.log(orders);

}

async function showOrderDetails(orderId) {

    currentOrderId = orderId;

    const productsDiv =
        document.getElementById("order-products");

    const statusSpan =
        document.getElementById("order-status");

    const addressDiv =
        document.getElementById("order-address");

    productsDiv.innerHTML = "Loading...";

    const modal = new bootstrap.Modal(
        document.getElementById("orderModal")
    );

    modal.show();

    document.getElementById("order-modal-title").innerText =
        `Order #${orderId}`;

    const response = await fetch(`/orders/${orderId}`);

    const order = await response.json();

    statusSpan.innerText = order.status;

    addressDiv.innerText =
        order.customer_address || "No address";

    let html = "";

    order.items.forEach(item => {

        html += `
            <div class="d-flex justify-content-between border-bottom py-2">

                <span>${item.product_name}</span>

                <strong>x${item.quantity}</strong>

            </div>
        `;

    });

    if (html === "") {
        html = "<p>No products found.</p>";
    }

    productsDiv.innerHTML = html;

}

async function confirmOrder(orderId) {

    const response = await fetch(`/orders/${orderId}/confirm`, {
        method: "PUT"
    });

    if (response.ok) {

        loadOrders();

        const modal =
            bootstrap.Modal.getInstance(
                document.getElementById("orderModal")
            );

        modal.hide();

    }
    else {

        const error = await response.json();

        alert(error.detail);

    }

}

</script>

<body>

<div class="container mt-5">

    <h1>Orders</h1>

    <table class="table table-bordered">

        <thead>

            <tr>

                <th>ID</th>
                <th>Customer</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Status</th>
                <th>Actions</th>

            </tr>

        </thead>

        <tbody id="orders-table">

        </tbody>

    </table>

</div>

<script>

window.onload = function () {
    loadOrders();
}

</script>

<div class="modal fade" id="orderModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 
                    class="modal-title"
                    id="order-modal-title">
                    Order Details
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="mb-3">

                    <strong>Status:</strong>

                    <span id="order-status"></span>

                </div>

                <div class="mb-4">

                    <strong>Address:</strong>

                    <div id="order-address"></div>

                </div>

                <hr>

                <h6>Products</h6>

                <div id="order-products">

                    Loading...

                </div>

            </div>

            <div class="modal-footer">

                <button
                    id="confirm-button"
                    class="btn btn-success"
                    onclick="confirmOrder(currentOrderId)">

                    Confirm

                </button>


                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Close

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
