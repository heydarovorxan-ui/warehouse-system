<!DOCTYPE html>
<html>

<head>
    <title>Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>


<script>

let categories = [];

async function loadProducts() {

    const response = await fetch("/products");

    const products = await response.json();

    
    const table = document.getElementById("products-table");

    table.innerHTML = "";

    products.forEach(product => {

        table.innerHTML += `
            <tr id="product-${product.id}">
                <td>${product.id}</td>
                <td>${product.name}</td>
                <td>${product.description}</td>
                <td>${product.quantity}</td>
                <td>${product.price}</td>
                <td>${product.category_name}</td>

                <td>
                    <button
                        class="btn btn-warning btn-sm"
                        onclick="editProduct(${product.id})">
                        Edit
                    </button>

                    <button
                        class="btn btn-warning btn-sm"
                        onclick="deleteProduct(${product.id})">
                        Delete
                    </button>
                </td>
            </tr>
        `;

    });

}

async function addProduct() {

    const product = {
        name: document.getElementById("name").value,
        description: document.getElementById("description").value,
        quantity: Number(document.getElementById("quantity").value),
        price: Number(document.getElementById("price").value),
        category_id: Number(document.getElementById("category_id").value)
    };

    const response = await fetch("/products", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(product)
    });

    if (response.ok) {
        loadProducts();
    } else {
        alert("Error creating product");
    }

}

async function loadCategories() {

    const response = await fetch("/categories");

    const data = await response.json();

    categories = data;

    const select = document.getElementById("category_id");

    select.innerHTML = "";

    categories.forEach(category => {

        select.innerHTML += `
            <option value="${category.id}">
                ${category.name}
            </option>
        `;

    });

}

function editProduct(id) {

    const row = document.getElementById(`product-${id}`);

    const cells = row.getElementsByTagName("td");

    const name = cells[1].innerText;
    const description = cells[2].innerText;
    const quantity = cells[3].innerText;
    const price = cells[4].innerText;
    const categoryName = cells[5].innerText;

    let categoryOptions = "";

    categories.forEach(category => {

        categoryOptions += `
            <option
                value="${category.id}"
                ${category.name === categoryName ? "selected" : ""}>
                ${category.name}
            </option>
    `   ;

    });

    row.innerHTML = `
        <td>${id}</td>

        <td>
            <input
                id="edit-name-${id}"
                class="form-control"
                value="${name}">
        </td>

        <td>
            <input
                id="edit-description-${id}"
                class="form-control"
                value="${description}">
        </td>

        <td>
            <input
                id="edit-quantity-${id}"
                class="form-control"
                type="number"
                value="${quantity}">
        </td>

        <td>
            <input
                id="edit-price-${id}"
                class="form-control"
                type="number"
                value="${price}">
        </td>

        <td>
            <select
                id="edit-category-${id}"
                class="form-select">

                ${categoryOptions}

            </select>
        </td>

        <td>
            <button
                class="btn btn-success btn-sm"
                onclick="saveProduct(${id})">
                Save
            </button>
        </td>
    `;

}

function saveProduct(id) {

    const name = document.getElementById(`edit-name-${id}`).value;
    const description = document.getElementById(`edit-description-${id}`).value;
    const quantity = document.getElementById(`edit-quantity-${id}`).value;
    const price = document.getElementById(`edit-price-${id}`).value;
    const categoryId = document.getElementById(`edit-category-${id}`).value;

    const product = {
        name: name,
        description: description,
        quantity: Number(quantity),
        price: Number(price),
        category_id: Number(categoryId)
    };

    console.log(product);

    fetch(`http://localhost:8000/products/${id}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(product)
    })
    .then(response => response.json())
    .then(data => {
        console.log(data);
        loadProducts();
    });
}

function deleteProduct(id) {

    if (!confirm("Are you sure you want to delete this product?")) {
        return;
    }

    fetch(`http://localhost:8000/products/${id}`, {
        method: "DELETE"
    })
    .then(response => {

        if (response.ok) {
            loadProducts();
        } else {
            alert("Error deleting product");
        }

    });

}

</script>


<body>

<div class="container mt-5">

    <h1>Products</h1>

    <div class="card p-4 mb-4">

    <h4>Add Product</h4>

    <input id="name"
           class="form-control mb-2"
           placeholder="Name">

    <input id="description"
           class="form-control mb-2"
           placeholder="Description">

    <input id="quantity"
           class="form-control mb-2"
           type="number"
           placeholder="Quantity">

    <input id="price"
           class="form-control mb-2"
           type="number"
           placeholder="Price">

    <select
        id="category_id"
        class="form-select mb-3">

    </select>

    <button
        class="btn btn-success"
        onclick="addProduct()">
        Add Product
    </button>

    </div>

    <table class="table table-bordered mt-4">

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Category</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="products-table">

        </tbody>

    </table>

</div>

<script>
window.onload = async function () {
    await loadCategories();
    await loadProducts();
};
</script>


</body>

</html>
