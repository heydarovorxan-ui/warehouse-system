<!DOCTYPE html>
<html>

<head>
    <title>Stock Movements</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script src="/static/js/navigation.js"></script>

</head>


<script>

async function loadStockMovements() {

    const token = localStorage.getItem("token");

    const response = await fetch("/stock/movements", {

        headers: {
            Authorization: `Bearer ${token}`
        }

    });

    if (response.status === 401) {

        localStorage.removeItem("token");

        window.location.href = "/login";

        return;
    }

    const movements = await response.json();

    const table = document.getElementById("movements-table");

    table.innerHTML = "";

    movements.forEach(movement => {

        let movementType = movement.movement_type;
        let typeBadge = "bg-secondary";

        if (movement.movement_type === "RECEIPT") {
            movementType = "Receipt";
            typeBadge = "bg-success";
        }

        if (movement.movement_type === "WRITE_OFF") {
            movementType = "Write-off";
            typeBadge = "bg-danger";
        }

        if (movement.movement_type === "ORDER") {
            movementType = "Order";
            typeBadge = "bg-primary";
        }

        const quantity =
            movement.quantity > 0
                ? `<span class="text-success fw-bold">+${movement.quantity}</span>`
                : `<span class="text-danger fw-bold">${movement.quantity}</span>`;

        const date = new Date(
            movement.created_at
        ).toLocaleString();

        const order =
            movement.order_id !== null
                ? `#${movement.order_id}`
                : "—";

        table.innerHTML += `

            <tr>

                <td>${movement.id}</td>

                <td>${date}</td>

                <td>${movement.product_name}</td>

                <td>${quantity}</td>

                <td>
                    <span class="badge ${typeBadge}">
                        ${movementType}
                    </span>
                </td>

                <td>${movement.reason ?? "—"}</td>

                <td>${movement.username}</td>

                <td>${order}</td>

            </tr>

        `;

    });

}

</script>


<body>

<div id="navigation"></div>

<div class="container mt-5">

    <h1>Stock Movements</h1>

    <table class="table table-bordered table-hover mt-4">

        <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Date</th>
                <th>Product</th>
                <th>Quantity</th>
                <th>Type</th>
                <th>Reason</th>
                <th>User</th>
                <th>Order</th>

            </tr>

        </thead>

        <tbody id="movements-table">

        </tbody>

    </table>

</div>


<script>

window.onload = function () {

    loadNavigation();
    loadStockMovements();

};

</script>


</body>

</html>
